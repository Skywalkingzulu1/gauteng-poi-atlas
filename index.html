<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gauteng POI Atlas</title>
<meta name="description" content="Small open datasets for Gauteng: residential complexes, hotels, health facilities and retail chains, built from OpenStreetMap." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --bg: #0f172a;
    --panel: #111c33;
    --panel-2: #17233d;
    --text: #e6edf7;
    --muted: #8fa3bf;
    --line: #22304d;
    --complex: #a78bfa;
    --hotel: #f472b6;
    --health: #f87171;
    --commerce: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(180deg, #14203a, #0f172a);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  header .sum { margin-left: auto; color: var(--muted); font-size: 12.5px; }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 330px; min-width: 280px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  }
  .search { padding: 12px; border-bottom: 1px solid var(--line); }
  .search input {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 13.5px;
  }
  .search input:focus { outline: 2px solid #2563eb55; }
  .layers { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .layer {
    display: flex; align-items: center; gap: 9px; padding: 6px 4px; border-radius: 7px;
    cursor: pointer; user-select: none;
  }
  .layer:hover { background: var(--panel-2); }
  .layer input { accent-color: #4f8cff; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .layer .name { flex: 1; }
  .layer .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .results { overflow: auto; flex: 1; padding: 6px 8px 12px; }
  .results h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .11em; color: var(--muted);
    margin: 10px 6px 6px;
  }
  .row {
    padding: 8px 9px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  }
  .row:hover { background: var(--panel-2); border-color: var(--line); }
  .row .t { font-size: 13px; }
  .row .m { color: var(--muted); font-size: 11.5px; }
  .row .tag {
    display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 4px;
    background: #ffffff14; color: var(--muted); margin-left: 4px;
  }
  footer {
    border-top: 1px solid var(--line); padding: 9px 12px; font-size: 11.5px; color: var(--muted);
  }
  footer a { color: #93c5fd; }
  footer .dl { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  #map { flex: 1; min-width: 0; background: #0b1220; }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
  .pop-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .pop-sub { color: #64748b; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
  .pop-row { margin-top: 6px; }
  .pop-row a { color: #1d4ed8; }
  .badge {
    display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
    background: #dbeafe; color: #1e40af; margin-top: 6px;
  }
  .badge.phys { background: #e2e8f0; color: #334155; }
  @media (max-width: 820px) {
    main { flex-direction: column-reverse; }
    aside { width: 100%; max-height: 45vh; border-right: 0; border-top: 1px solid var(--line); }
    #map { min-height: 55vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Gauteng POI Atlas</h1>
  <span class="sub">residential complexes &middot; hotels &middot; health &middot; commerce</span>
  <span class="sum" id="sum"></span>
</header>

<main>
  <aside>
    <div class="search">
      <input id="q" type="search" placeholder="Search name, suburb or brand..." autocomplete="off" />
    </div>
    <div class="layers" id="layers"></div>
    <div class="results" id="results"></div>
    <footer>
      <div class="dl">
        <a href="data/all.geojson" download>all.geojson</a>
        <a href="data/complexes.geojson" download>complexes</a>
        <a href="data/hotels.geojson" download>hotels</a>
        <a href="data/health.geojson" download>health</a>
        <a href="data/commerce.geojson" download>commerce</a>
      </div>
      Data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors (ODbL).
      Generated 2026-11-18 from the Geofabrik South Africa extract.
    </footer>
  </aside>
  <div id="map"></div>
</main>

<script src="data/points.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const CONFIG = {
  complex:  { label: 'Residential complexes', color: '#a78bfa', file: 'data/complexes.geojson' },
  hotel:    { label: 'Hotels',                color: '#f472b6', file: 'data/hotels.geojson' },
  health:   { label: 'Health facilities',     color: '#f87171', file: 'data/health.geojson' },
  commerce: { label: 'Commerce',              color: '#38bdf8', file: 'data/commerce.geojson' }
};

const map = L.map('map', { zoomControl: true, preferCanvas: true }).setView([-26.1, 28.05], 9);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri'
}).addTo(map);

const state = { records: [], enabled: new Set(Object.keys(CONFIG)), query: '' };
const layerGroups = {};
Object.keys(CONFIG).forEach(k => { layerGroups[k] = L.layerGroup().addTo(map); });

function popupHtml(r) {
  const p = r.props;
  const bits = [];
  bits.push(`<div class="pop-name">${esc(p.name)}</div>`);
  bits.push(`<div class="pop-sub">${esc(p.subtype || r.kind)}</div>`);
  if (p.address) bits.push(`<div class="pop-row">${esc(p.address)}</div>`);
  if (p.opening_hours) bits.push(`<div class="pop-row">${esc(p.opening_hours)}</div>`);
  if (p.phone) bits.push(`<div class="pop-row">${esc(p.phone)}</div>`);
  if (p.website) bits.push(`<div class="pop-row"><a href="${esc(p.website)}" target="_blank" rel="noopener">${esc(shortUrl(p.website))}</a></div>`);
  if (p.channel) bits.push(`<span class="badge ${p.channel === 'physical' ? 'phys' : ''}">${esc(p.channel)}</span>`);
  bits.push(`<div class="pop-row"><a href="https://www.openstreetmap.org/${p.osm_type}/${p.osm_id}" target="_blank" rel="noopener">OSM ${p.osm_type}/${p.osm_id}</a></div>`);
  return bits.join('');
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortUrl(u) {
  try { return new URL(u).host.replace(/^www\./, ''); } catch { return u; }
}

function matches(r) {
  if (!state.enabled.has(r.kind)) return false;
  if (!state.query) return true;
  const p = r.props;
  const hay = [p.name, p.subtype, p.brand, p.address].filter(Boolean).join(' ').toLowerCase();
  return state.query.split(/\s+/).every(t => hay.includes(t));
}

function redraw() {
  Object.values(layerGroups).forEach(g => g.clearLayers());
  const visible = [];
  for (const r of state.records) {
    if (!matches(r)) continue;
    visible.push(r);
    const m = L.circleMarker([r.lat, r.lon], {
      radius: r.kind === 'commerce' ? 6 : 7,
      color: '#0b1220', weight: 1.2,
      fillColor: CONFIG[r.kind].color, fillOpacity: 0.92
    });
    m.bindPopup(popupHtml(r));
    m.on('click', () => highlight(r.id));
    m.addTo(layerGroups[r.kind]);
  }
  renderResults(visible);
  document.getElementById('sum').textContent = `${visible.length} of ${state.records.length} points shown`;
}

function renderResults(visible) {
  const box = document.getElementById('results');
  const groups = {};
  for (const r of visible) (groups[r.kind] ||= []).push(r);
  let html = '';
  for (const kind of Object.keys(CONFIG)) {
    const rows = (groups[kind] || []).sort((a, b) => a.props.name.localeCompare(b.props.name));
    if (!rows.length) continue;
    html += `<h2>${esc(CONFIG[kind].label)} &middot; ${rows.length}</h2>`;
    for (const r of rows) {
      const p = r.props;
      html += `<div class="row" data-id="${r.id}">
        <div class="t">${esc(p.name)}${p.brand && p.brand !== p.name ? `<span class="tag">${esc(p.brand)}</span>` : ''}</div>
        <div class="m">${esc(p.subtype || '')}${p.address ? ' &middot; ' + esc(p.address) : ''}${p.channel ? ' &middot; ' + esc(p.channel) : ''}</div>
      </div>`;
    }
  }
  box.innerHTML = html || '<h2>No matches</h2>';
}

function highlight(id) {
  document.querySelectorAll('.row').forEach(el => el.classList.toggle('active', el.dataset.id === id));
}

document.getElementById('results').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row) return;
  const rec = state.records.find(r => r.id === row.dataset.id);
  if (!rec) return;
  map.setView([rec.lat, rec.lon], 16, { animate: true });
  const target = layerGroups[rec.kind].getLayers().find(l => l.getLatLng().lat === rec.lat && l.getLatLng().lng === rec.lon);
  if (target) target.openPopup();
  highlight(rec.id);
});

document.getElementById('q').addEventListener('input', e => {
  state.query = e.target.value.trim().toLowerCase();
  redraw();
});

function buildLayerControls() {
  const box = document.getElementById('layers');
  for (const [kind, cfg] of Object.entries(CONFIG)) {
    const count = state.records.filter(r => r.kind === kind).length;
    const el = document.createElement('label');
    el.className = 'layer';
    el.innerHTML = `<input type="checkbox" checked data-kind="${kind}">
      <span class="dot" style="background:${cfg.color}"></span>
      <span class="name">${cfg.label}</span>
      <span class="count">${count}</span>`;
    el.querySelector('input').addEventListener('change', ev => {
      ev.target.checked ? state.enabled.add(kind) : state.enabled.delete(kind);
      redraw();
    });
    box.appendChild(el);
  }
}

async function loadRecords() {
  // points.js is generated next to the GeoJSON files and works from file:// too
  if (Array.isArray(window.POI_DATA)) return window.POI_DATA;
  const entries = Object.entries(CONFIG);
  const payloads = await Promise.all(
    entries.map(([, c]) => fetch(c.file).then(r => r.json()).catch(() => null))
  );
  const records = [];
  entries.forEach(([kind], i) => {
    const fc = payloads[i];
    if (!fc) return;
    for (const f of fc.features) {
      const [lon, lat] = f.geometry.coordinates;
      records.push({ kind, lat, lon, props: f.properties });
    }
  });
  return records;
}

async function boot() {
  const records = await loadRecords();
  for (const r of records) {
    state.records.push({
      id: `${r.kind}-${r.props.osm_type}-${r.props.osm_id}`,
      kind: r.kind, lat: r.lat, lon: r.lon, props: r.props
    });
  }
  buildLayerControls();
  redraw();
  if (state.records.length) {
    const bounds = L.latLngBounds(state.records.map(r => [r.lat, r.lon]));
    map.fitBounds(bounds.pad(0.12));
  }
}

boot();
</script>
</body>
</html>
